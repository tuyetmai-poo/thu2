<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery - Bootstrap</title>
    <!-- Nhúng Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Tùy chỉnh nhẹ hiệu ứng hover và tỉ lệ ảnh */
        .gallery-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            border-radius: 8px;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .gallery-img {
            width: 100%;
            height: 220px;
            object-fit: cover; /* Giữ tỉ lệ ảnh không bị méo */
        }
    </style>
</head>
<body class="bg-light py-5">

    <div class="container">
        <!-- Tiêu đề Gallery -->
        <div class="text-center mb-5">
            <h1 class="fw-bold">Thư Viện Ảnh (Gallery)</h1>
            <p class="text-muted">Bố cục Responsive với Bootstrap Grid System</p>
        </div>

        <!-- Khung Lưới Gallery: Dùng g-4 để tạo khoảng cách (gutter) giữa các cột -->
        <div class="row g-4">

            <!-- Ảnh 1 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 gallery-card">
                    <img src="https://picsum.photos/id/1015/600/400" class="card-img-top gallery-img" alt="Cảnh quan thiên nhiên">
                    <div class="card-body text-center bg-white">
                        <h6 class="card-title mb-0 fw-semibold">Thiên nhiên 1</h6>
                    </div>
                </div>
            </div>

            <!-- Ảnh 2 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 gallery-card">
                    <img src="https://picsum.photos/id/1018/600/400" class="card-img-top gallery-img" alt="Cảnh quan thiên nhiên">
                    <div class="card-body text-center bg-white">
                        <h6 class="card-title mb-0 fw-semibold">Thiên nhiên 2</h6>
                    </div>
                </div>
            </div>

            <!-- Ảnh 3 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 gallery-card">
                    <img src="https://picsum.photos/id/1025/600/400" class="card-img-top gallery-img" alt="Cảnh quan thiên nhiên">
                    <div class="card-body text-center bg-white">
                        <h6 class="card-title mb-0 fw-semibold">Động vật hoang dã</h6>
                    </div>
                </div>
            </div>

            <!-- Ảnh 4 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 gallery-card">
                    <img src="https://picsum.photos/id/1036/600/400" class="card-img-top gallery-img" alt="Cảnh quan thiên nhiên">
                    <div class="card-body text-center bg-white">
                        <h6 class="card-title mb-0 fw-semibold">Mùa đông</h6>
                    </div>
                </div>
            </div>

            <!-- Ảnh 5 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 gallery-card">
                    <img src="https://picsum.photos/id/1043/600/400" class="card-img-top gallery-img" alt="Cảnh quan thiên nhiên">
                    <div class="card-body text-center bg-white">
                        <h6 class="card-title mb-0 fw-semibold">Rừng núi</h6>
                    </div>
                </div>
            </div>

            <!-- Ảnh 6 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 gallery-card">
                    <img src="https://picsum.photos/id/1050/600/400" class="card-img-top gallery-img" alt="Cảnh quan thiên nhiên">
                    <div class="card-body text-center bg-white">
                        <h6 class="card-title mb-0 fw-semibold">Đồng cỏ</h6>
                    </div>
                </div>
            </div>

            <!-- Ảnh 7 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 gallery-card">
                    <img src="https://picsum.photos/id/1069/600/400" class="card-img-top gallery-img" alt="Cảnh quan thiên nhiên">
                    <div class="card-body text-center bg-white">
                        <h6 class="card-title mb-0 fw-semibold">Bờ biển hoàng hôn</h6>
                    </div>
                </div>
            </div>

            <!-- Ảnh 8 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 gallery-card">
                    <img src="https://picsum.photos/id/1074/600/400" class="card-img-top gallery-img" alt="Cảnh quan thiên nhiên">
                    <div class="card-body text-center bg-white">
                        <h6 class="card-title mb-0 fw-semibold">Sư tử biển</h6>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Nhúng Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
